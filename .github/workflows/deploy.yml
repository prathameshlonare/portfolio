name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-north-1
      S3_BUCKET: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Validate environment variables
        run: |
          if [ -z "${S3_BUCKET}" ] || [ -z "${CLOUDFRONT_DISTRIBUTION_ID}" ]; then
            echo "::error::Missing required repository variables: S3_BUCKET_NAME and CLOUDFRONT_DISTRIBUTION_ID must be set in GitHub repository settings under Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build and export
        run: npm run build
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN || vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          # 1. Hashed static assets — cache forever (filenames change on every build)
          aws s3 sync out/_next/static/ "s3://${S3_BUCKET}/_next/static/" \
            --region "${AWS_REGION}" \
            --cache-control "public, max-age=31536000, immutable"

          # 2. HTML files — never cache in browser (always revalidate on visit)
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --region "${AWS_REGION}" \
            --exclude "_next/static/*" \
            --exclude "*.js" \
            --exclude "*.css" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 3. Everything else (images, fonts, public assets) — 1 day cache
          aws s3 sync out/ "s3://${S3_BUCKET}/" \
            --region "${AWS_REGION}" \
            --delete \
            --exclude "_next/static/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"

      - name: Configure CloudFront 404 error page
        run: |
          # Get current distribution config
          aws cloudfront get-distribution-config \
            --id "${CLOUDFRONT_DISTRIBUTION_ID}" > /tmp/cf-config.json

          # Check if 404 custom error response is already configured
          ALREADY_CONFIGURED=$(python3 -c "
          import sys, json
          try:
              data = json.load(open('/tmp/cf-config.json'))['DistributionConfig']
              items = data.get('CustomErrorResponses', {}).get('Items', [])
              matched = any(i.get('ErrorCode') == 404 and i.get('ResponsePagePath') == '/404.html' for i in items)
              print('yes' if matched else 'no')
          except Exception:
              print('no')
          ")

          if [ "$ALREADY_CONFIGURED" = "yes" ]; then
            echo "CloudFront 404 custom error page is already configured. Skipping distribution update."
          else
            echo "Configuring CloudFront 404 custom error response..."
            ETAG=$(cat /tmp/cf-config.json | python3 -c "import sys,json; print(json.load(sys.stdin)['ETag'])")

            cat /tmp/cf-config.json | python3 -c "
            import sys, json
            data = json.load(sys.stdin)['DistributionConfig']
            data['CustomErrorResponses'] = {
              'Quantity': 1,
              'Items': [
                {
                  'ErrorCode': 404,
                  'ResponsePagePath': '/404.html',
                  'ResponseCode': '404',
                  'ErrorCachingMinTTL': 10
                }
              ]
            }
            json.dump(data, open('/tmp/cf-update.json', 'w'))
            "

            aws cloudfront update-distribution \
              --id "${CLOUDFRONT_DISTRIBUTION_ID}" \
              --if-match "$ETAG" \
              --distribution-config file:///tmp/cf-update.json
          fi

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
