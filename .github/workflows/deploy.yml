name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and export
        run: npm run build
        env:
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ secrets.NEXT_PUBLIC_CF_BEACON_TOKEN || vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Sync to S3
        run: |
          # 1. Hashed static assets — cache forever (filenames change on every build)
          aws s3 sync out/_next/static/ s3://prathameshlonare.me/_next/static/ \
            --region eu-north-1 \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          # 2. HTML files — never cache in browser (always revalidate on visit)
          aws s3 sync out/ s3://prathameshlonare.me/ \
            --region eu-north-1 \
            --delete \
            --exclude "_next/static/*" \
            --exclude "*.js" \
            --exclude "*.css" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate"

          # 3. Everything else (images, fonts, public assets) — 1 day cache
          aws s3 sync out/ s3://prathameshlonare.me/ \
            --region eu-north-1 \
            --delete \
            --exclude "_next/static/*" \
            --exclude "*.html" \
            --cache-control "public, max-age=86400"

      - name: Configure CloudFront 404 error page
        run: |
          # Get current distribution config
          aws cloudfront get-distribution-config \
            --id E76HPAMYIL45V > /tmp/cf-config.json

          # Extract ETag for conditional update
          ETAG=$(cat /tmp/cf-config.json | python3 -c "import sys,json; print(json.load(sys.stdin)['ETag'])")

          # Build update: add custom error response for 404
          cat /tmp/cf-config.json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)['DistributionConfig']
          data['CustomErrorResponses'] = {
            'Quantity': 1,
            'Items': [
              {
                'ErrorCode': 404,
                'ResponsePagePath': '/404.html',
                'ResponseCode': '404',
                'ErrorCachingMinTTL': 10
              }
            ]
          }
          json.dump(data, open('/tmp/cf-update.json', 'w'))
          "

          # Apply update
          aws cloudfront update-distribution \
            --id E76HPAMYIL45V \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/cf-update.json

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E76HPAMYIL45V \
            --paths "/*"
